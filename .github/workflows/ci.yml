name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - run: make lint

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install zsh
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh
      - run: ./test/smoke.sh

  # The real test of a bootstrap script is a machine that has never seen it.
  bootstrap:
    strategy:
      fail-fast: false
      matrix:
        image: [ubuntu:24.04, debian:12, fedora:41]
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    steps:
      - name: Install prerequisites
        run: |
          if command -v apt-get >/dev/null; then
            apt-get update -qq && apt-get install -y -qq git ca-certificates sudo zsh
          else
            dnf install -y -q git sudo zsh
          fi
      - uses: actions/checkout@v4
      - name: Bootstrap from this checkout
        run: |
          ./install.sh --repo "file://$(pwd)" --root /tmp/kickstart --profile base
      - name: Verify
        run: |
          /tmp/kickstart/bin/kickstart status
          /tmp/kickstart/bin/kickstart doctor
          test -L "$HOME/.tmux.conf"
          grep -q 'kickstart:shell' "$HOME/.bashrc"
          bash -c '. /tmp/kickstart/shell/init.sh && command -v khelp'
          zsh  -c '. /tmp/kickstart/shell/init.sh && command -v khelp'
