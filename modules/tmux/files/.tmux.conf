# Managed by kickstart. No plugin manager on purpose: this file has to work
# unchanged on a locked-down remote box with tmux 2.x and no internet.

set  -g prefix C-a
unbind C-b
bind C-a send-prefix

set  -g base-index 1
setw -g pane-base-index 1
set  -g renumber-windows on
set  -g history-limit 50000
set  -sg escape-time 10
set  -g display-time 2000
set  -g focus-events on
setw -g mode-keys vi

# Splits that keep the current directory, with keys that look like the split.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Pane navigation without the prefix dance.
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

bind r source-file ~/.tmux.conf \; display "reloaded"

set -g mouse on
set -g set-titles on
set -g set-titles-string "#S:#I #W"

# Status line: session on the left, host and time on the right. The hostname
# matters more than it sounds when you are three ssh hops deep.
set -g status-interval 5
set -g status-style "bg=default,fg=colour245"
set -g status-left  "#[fg=colour39,bold] #S #[default]"
set -g status-left-length 30
set -g status-right "#[fg=colour245]#(whoami)@#H #[fg=colour240]| #[fg=colour245]%H:%M "
set -g status-right-length 60
setw -g window-status-current-style "fg=colour39,bold"
set -g pane-active-border-style "fg=colour39"
set -g pane-border-style "fg=colour238"
set -g message-style "bg=colour39,fg=black"
