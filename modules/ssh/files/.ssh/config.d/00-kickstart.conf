# Managed by kickstart -- edit in the repo, not here.
# Host-local entries belong in ~/.ssh/config.d/99-local.conf.

Host *
    # Reuse one TCP connection for repeated sessions to the same host. This is
    # the single biggest quality-of-life win on high-latency links.
    ControlMaster auto
    ControlPath ~/.ssh/control/%C
    ControlPersist 10m

    # Survive flaky links and NAT timeouts.
    ServerAliveInterval 30
    ServerAliveCountMax 6
    TCPKeepAlive yes

    # Only offer the identity configured for the host, not every key in the
    # agent. Stops "too many authentication failures" disconnects.
    IdentitiesOnly yes
    AddKeysToAgent yes

    HashKnownHosts no
    StrictHostKeyChecking ask
    VisualHostKey yes

    # Forwarding is off unless a specific host opts in. Agent forwarding in
    # particular lets anyone with root on the far end use your keys.
    ForwardAgent no
    ForwardX11 no

    Compression yes
